[project]
name = "tianshu"
version = "0.1.0"
description = "天枢 Agent — 桌面 Agent OS"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
tianshu = "tianshu.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tianshu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
