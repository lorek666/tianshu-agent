name: Baseline CLI Windows diagnostic
on:
  push:
    branches: [codex/g3-baseline-windows-probe]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b3f60d6fe330a2a9b3fe1bfc8ff373f8b7dd5ff
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Verify frozen source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git status --porcelain=v1
          uv run --frozen python -c 'import hashlib, pathlib, sys; print(sys.version); print(sys.executable); [(print(str(p), hashlib.sha256(p.read_bytes()).hexdigest())) for p in map(pathlib.Path, ["scripts/baseline_evidence.py", "tests/test_baseline_evidence.py"])]'
      - name: Lockfile
        run: uv lock --check
      - name: Sync frozen dependencies
        run: uv sync --frozen
      - name: Original prefix with full collection imports
        run: |
          uv run --frozen python - <<'PYPROBE'
          from pathlib import Path
          import subprocess
          import sys
          keep = {"test_acceptance.py", "test_approval_reject.py", "test_authority_block.py", "test_backend_contract.py", "test_backup.py", "test_backup_materials.py", "test_baseline_evidence.py"}
          excluded = sorted(p.as_posix() for p in Path("tests").rglob("test_*.py") if p.name not in keep)
          command = [sys.executable, "scripts/pytest_with_stacks.py", "-o", "addopts=", "-vv", "-rs", "--tb=long", "--show-capture=all", "--durations=20", "--stack-timeout=60"]
          command.extend("--deselect=" + path for path in excluded)
          print("FULL_COLLECTION_PREFIX", sorted(keep), "deselect_files", len(excluded), flush=True)
          raise SystemExit(subprocess.run(command).returncode)
          PYPROBE
