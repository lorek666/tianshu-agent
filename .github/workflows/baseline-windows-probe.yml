name: Baseline CLI Windows diagnostic
on:
  push:
    branches: [codex/g3-baseline-windows-probe]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b3f60d6fe330a2a9b3fe1bfc8ff373f8b7dd5ff
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Verify frozen source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git status --porcelain=v1
          uv run --frozen python -c 'import hashlib, pathlib, sys; print(sys.version); print(sys.executable); [(print(str(p), hashlib.sha256(p.read_bytes()).hexdigest())) for p in map(pathlib.Path, ["scripts/baseline_evidence.py", "tests/test_baseline_evidence.py"])]'
      - name: Lockfile
        run: uv lock --check
      - name: Sync frozen dependencies
        run: uv sync --frozen
      - name: Observe worker identity with complete cleanup records
        run: |
          uv run --frozen python - <<'PYPROBE'
          import base64, hashlib, os, pathlib, subprocess, sys
          payload = base64.b64decode("")
          assert hashlib.sha256(payload).hexdigest() == "de9af24a7161682d4eddd3c6e76f2f6e796d4a06e6f2432c9c54d9ba40d2ee46"
          script = pathlib.Path(os.environ["RUNNER_TEMP"]) / "baseline-worker-causal-probe-v2.py"
          with script.open("xb") as stream:
              stream.write(payload)
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "baseline-worker-causal-results-v2"
          raise SystemExit(subprocess.run([sys.executable, str(script), "--repo", ".", "--out", str(out)]).returncode)
          PYPROBE
