name: Windows approval RPC diagnostic

on:
  push:
    branches: [codex/windows-approval-rpc-diagnostics]

permissions:
  contents: read

jobs:
  diagnostic:
    name: Approval timing during Windows shard 3 (diagnostic only)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FROZEN_SHA: 281dd22261105d32910ae5838a7873f0a1c693f1
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: frozen
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: frozen/uv.lock
      - name: Prepare the frozen checkout
        shell: bash
        working-directory: frozen
        run: |
          uv python install 3.12
          uv lock --check
          uv sync --frozen
          uv run --frozen ruff check .
      - name: Run unmodified shard selection with approval observation enabled for the smoke test
        shell: bash
        working-directory: frozen
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          PYTEST_ADDOPTS: ""
          CI_SHARD_INDEX: "3"
          CI_SHARD_REPORT: ${{ runner.temp }}/approval-diagnostic/shard.json
          TIANSHU_SLO_DIAGNOSTICS_DIR: ${{ runner.temp }}/approval-diagnostic/slo
          TIANSHU_APPROVAL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/approval-diagnostic/timings
        run: |
          frozen_sha="$(git rev-parse HEAD)"
          probe_sha="$(git -C ../probe rev-parse HEAD)"
          test "$frozen_sha" = "$FROZEN_SHA"
          test "$probe_sha" = "$WORKFLOW_SHA"
          mkdir -p "$(dirname "$CI_SHARD_REPORT")"
          printf 'workflow_sha=%s\nprobe_checkout=%s\nfrozen_checkout=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$WORKFLOW_SHA" "$probe_sha" "$frozen_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$(dirname "$CI_SHARD_REPORT")/diagnostic-identity.txt"
          PYTHONPATH="$(cygpath -w ../probe/scripts/approval_rpc_diagnostic)"
          export PYTHONPATH
          # This recorder requires the tested checkout SHA, while the diagnostic
          # workflow itself runs from a separate branch. Keep both in the artifact.
          GITHUB_SHA="$frozen_sha" uv run --frozen python scripts/pytest_with_stacks.py -p pytest_ci_shards \
            --ci-shard-index=3 --ci-shard-count=4 --ci-shard-report="$CI_SHARD_REPORT" \
            -o addopts="" -vv -rs --tb=short --durations=20 --stack-timeout=60 \
            -p approval_trace_plugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approval-rpc-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval-diagnostic
          if-no-files-found: error
