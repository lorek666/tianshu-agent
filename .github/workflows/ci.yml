name: CI

# Python 检查与 CONTRIBUTING.md §5 使用同一锁文件和测试套件：
# uv lock --check 与 ruff 命令相同；pytest 增加汇总、跳过原因及 Windows
# 长等待诊断参数，并在两个独立 Windows runner 按文件分片。
# UI 另有类型、测试、构建与 dist 一致性检查；macOS required job 与 Windows
# required 汇总还会覆盖 R1 Tauri 壳的 fmt/test/clippy。
# 三个平台的 Python 检查和 UI 检查均为 required，准确名称见 CONTRIBUTING §6。
#
# 为什么只有 3.12：pyproject.toml 的 requires-python 是 ">=3.12,<3.13"，
# 3.13 不在支持范围内，矩阵里加它等于给自己造一个必然红的目标。
on:
  push:
    branches: [main]
  pull_request:
    # Iterative work stays in draft PRs. Marking ready is the final candidate
    # freeze signal; only then does this workflow allocate the full runner
    # matrix. A later push still gets its own exact-SHA run.
    types: [opened, reopened, synchronize, ready_for_review]

# PR：按分支分组，连推时取消上一轮——省 runner，也不会有过期的绿色。
# main：按 commit 分组，每个 commit 都要拿到自己的结论。
#   一开始两种都用 ref 分组 + cancel-in-progress: true，结果连续合并时
#   后一个把前一个取消掉了：PR #20 的合并提交 d69e7f8（就是引入本 CI 的
#   那个提交）的 CI 被 #22 的合并取消，从未拿到结论。CONTRIBUTING §2 说
#   "main 永远可运行"，那就得每个 commit 都真跑过，不能靠前一个绿色顶替。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}) · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # 每个平台的上限。默认是 360 分钟：一个挂住的测试会把 runner 占 6 小时，
    # 而"超时"和"挂住"对排查是两件完全不同的事——超时至少会带着已经跑过的
    # 输出结束。（实测踩过：windows job 卡在 Pytest 里 20 分钟没动静。）
    timeout-minutes: 25
    strategy:
      # 一个平台红了不要取消其他平台：否则看不到全貌，
      # 报告只能写"矩阵失败"，没法说清是谁、为什么。
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python:
          - "3.12"
    defaults:
      run:
        # Python job 统一使用 bash，避免 Windows 默认 PowerShell 的引号规则
        # 改变 addopts="" 等参数的传递方式。
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          # 缓存 uv 的缓存目录：下载过的 Python 解释器、wheel 都复用
          enable-cache: true
          # 只有锁文件变了才换缓存键——依赖没动就命中同一份
          cache-dependency-glob: uv.lock

      - name: 安装 Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: 锁文件漂移门禁
        # 这条是整个 workflow 里最重要的一条，也是最容易写错的一条。
        # 实测（uv 0.11.7）：`uv sync --frozen` 在 pyproject 改过、锁文件过期时
        # 仍然 exit 0——"使用锁文件"不等于"校验锁文件"。只有 `uv lock --check`
        # 会让漂移变红。没有这条，锁文件可以悄悄烂掉而 CI 一直绿。
        run: uv lock --check

      - name: 同步依赖（只读锁文件）
        run: uv sync --frozen

      - name: Ruff
        # --frozen 让 uv run 不去动锁文件；否则 pyproject 一有风吹草动，
        # uv run 会顺手把锁文件改掉，上面那条漂移门禁就白设了。
        run: uv run --frozen ruff check .

      - name: 开源许可证合规与 SBOM 门禁（F15）
        run: uv run --frozen python scripts/check_licenses_and_sbom.py --out "${RUNNER_TEMP}/tianshu-sbom.cdx.json"

      - name: Pytest
        # 清空项目的 -q，避免重复传入后隐藏汇总；-rs 保留平台跳过原因。
        run: uv run --frozen pytest -o addopts="" -q -rs

  # macOS Python 分到两个独立原生 runner，Rust 另占一个；各限25分钟。
  # 保留直接 pytest 路径，不新增 watchdog；required 严格核验原始分片和 Rust。
  macos_python:
    name: macos python shard ${{ matrix.shard }} · py3.12
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - name: 开源许可证合规与 SBOM 门禁（F15）
        run: uv run --frozen python scripts/check_licenses_and_sbom.py --out "${RUNNER_TEMP}/tianshu-sbom.cdx.json"
      - name: Pytest
        env:
          PYTHONPATH: scripts
          PYTEST_ADDOPTS: ""
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_ROOT: ${{ runner.temp }}/macos-ci
          TIANSHU_SLO_DIAGNOSTICS_DIR: ${{ runner.temp }}/macos-slo-diagnostics
        run: >-
          uv run --frozen pytest -o addopts="" -q -rs -p pytest_ci_shards
          --ci-shard-index="$CI_SHARD_INDEX" --ci-shard-count=2
          --ci-shard-report="$CI_SHARD_ROOT/shard.json"
          --basetemp="$CI_SHARD_ROOT-runtime"
          -o cache_dir="$CI_SHARD_ROOT-cache"
      - name: 上传 macOS 分片原始报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pytest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/macos-ci/shard.json
          if-no-files-found: error
      - name: 上传 state 背压诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-slo-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/macos-slo-diagnostics
          if-no-files-found: warn

  desktop_macos:
    name: desktop rust checks · macos
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Rust fmt（macOS）
        run: cargo fmt --check
      - name: Rust tests（macOS）
        run: cargo test --locked
      - name: Rust clippy（macOS）
        run: cargo clippy --locked --all-targets -- -D warnings

  macos_summary:
    name: test (macos-latest) · py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: [macos_python, desktop_macos]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: 解析 macOS 分片实际 attempt
        id: shard_artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen python scripts/ci_artifacts.py
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --prefix macos-pytest --indices 0 1 --github-output "$GITHUB_OUTPUT"
      - name: 下载 macOS 分片 0
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.shard_artifacts.outputs.shard_0_name }}
          path: ${{ runner.temp }}/macos-ci-shards/0
      - name: 下载 macOS 分片 1
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.shard_artifacts.outputs.shard_1_name }}
          path: ${{ runner.temp }}/macos-ci-shards/1
      - name: 验证 macOS 上游结论与完整覆盖
        if: always()
        env:
          SHARD_REPORTS: ${{ runner.temp }}/macos-ci-shards
          UPSTREAM_RESULT: ${{ needs.macos_python.result }}
        run: >-
          uv run --frozen python scripts/pytest_ci_shards.py verify
          --reports-root "$SHARD_REPORTS" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempts '${{ steps.shard_artifacts.outputs.attempts }}'
          --count 2 --indices 0 1 --needs-result "$UPSTREAM_RESULT"
      - name: Require complete native macOS gates
        if: always()
        env:
          PYTHON_RESULT: ${{ needs.macos_python.result }}
          DESKTOP_RESULT: ${{ needs.desktop_macos.result }}
        shell: bash
        run: |
          test "$PYTHON_RESULT" = success
          test "$DESKTOP_RESULT" = success

  # Windows 保留完整覆盖（含 issue #21/#50 回归），分到两个独立 runner。
  # 每台并行两个隔离 worker；四个整文件分片不改变25分钟上限或验收。
  windows_shards:
    name: windows shard ${{ matrix.shard }} · py3.12
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - name: 恢复 T1 Windows 原生句柄探针
        if: matrix.shard == 0
        env:
          RESTORE_T1_PROBE_REPORT: ${{ runner.temp }}/windows-ci/restore-t1-windows.json
        run: >-
          uv run --frozen python scripts/restore_t1_windows_probe.py
          --output "$RESTORE_T1_PROBE_REPORT"
      - name: Pytest Windows 分片
        env:
          PYTEST_ADDOPTS: ""
          CI_PAIR_ROOT: ${{ runner.temp }}/windows-ci/reports
          TIANSHU_SLO_DIAGNOSTICS_DIR: ${{ runner.temp }}/windows-ci/slo-diagnostics
        # 保留原 wrapper/fatal handler/60秒 Python 线程栈；C 扩展长期持有 GIL
        # 时仍不能保证采样。此 step 唯一直接命令保留 wrapper 最终退出码。
        run: >-
          uv run --frozen python scripts/pytest_with_stacks.py
          --ci-pair-index=${{ matrix.shard }} --ci-pair-root="$CI_PAIR_ROOT"
          -o addopts="" -vv -rs --tb=short
          --durations=20 --stack-timeout=60
      - name: 上传本分片原始报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-ci/reports
          if-no-files-found: error
      - name: 上传 Windows SLO 原始样本与失败诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-slo-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-ci/slo-diagnostics
          if-no-files-found: warn
      - name: 上传恢复 T1 Windows 原生证据
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: restore-t1-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-ci/restore-t1-windows.json
          if-no-files-found: warn

  desktop_windows:
    name: desktop rust checks · windows
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Rust fmt
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --locked
      - name: Rust clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows_summary:
    # 名称保留为原 required check；此 job 在 Ubuntu 核验两个 Windows job。
    name: test (windows-latest) · py3.12
    runs-on: ubuntu-latest
    needs: [windows_shards, desktop_windows]
    # 上游失败也必须进入汇总，不能让 required 因依赖失败而 skip 成 success。
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: 解析 Windows 分片实际 attempt
        id: shard_artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen python scripts/ci_artifacts.py
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --prefix windows-pytest --indices 0 1 --reports-per-artifact 2
          --github-output "$GITHUB_OUTPUT"
      - name: 下载分片 0
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.shard_artifacts.outputs.shard_0_name }}
          path: ${{ runner.temp }}/windows-ci-shards/0
      - name: 下载分片 1
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.shard_artifacts.outputs.shard_1_name }}
          path: ${{ runner.temp }}/windows-ci-shards/1
      - name: 验证上游结论与完整覆盖
        if: always()
        env:
          SHARD_REPORTS: ${{ runner.temp }}/windows-ci-shards
          UPSTREAM_RESULT: ${{ needs.windows_shards.result }}
          UPSTREAM_DESKTOP_RESULT: ${{ needs.desktop_windows.result }}
        # JSON 的 session exit 不能替代 wrapper 最终退出或上传/取消的 job 结论。
        run: >-
          uv run --frozen python scripts/pytest_ci_shards.py verify
          --reports-root "$SHARD_REPORTS" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempts '${{ steps.shard_artifacts.outputs.attempts }}'
          --count 4 --indices 0 1 2 3 --needs-result "$UPSTREAM_RESULT"
      - name: 验证 Windows 桌面壳门禁
        if: always()
        env:
          UPSTREAM_DESKTOP_RESULT: ${{ needs.desktop_windows.result }}
        run: test "$UPSTREAM_DESKTOP_RESULT" = success

  # UI 是 M5 才进仓库的：React + TS，构建产物（ui/dist）提交进仓库，因为
  # Host 运行时直接加载它——用户机器上不需要 Node。既然产物是"源码的一部分"，
  # 就必须有一条门禁保证它**没有和源码漂移**，否则会出现"改了前端没重新构建，
  # 界面还是旧版"这种只有用户能发现的问题。
  #
  # 只在 ubuntu 跑：前端不涉及平台差异（没有原生模块），三平台各跑一遍纯属浪费
  # runner；跨平台语义由 Python 的 test_host.py（三平台矩阵）覆盖。
  ui:
    name: ui · typecheck / test / build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本地构建产物所用的版本对齐：vite 的产物哈希由源码决定，但
          # lockfile 解释器/打包器版本变化会改变产物，dist 漂移门禁就会误报。
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 安装前端依赖（只读锁文件）
        run: pnpm --dir ui install --frozen-lockfile

      - name: 类型检查
        run: pnpm --dir ui run typecheck

      - name: 前端单测
        run: pnpm --dir ui run test

      - name: 构建
        run: pnpm --dir ui run build

      - name: 提交的 dist 必须与源码构建一致
        # `git diff --exit-code`：重建后若有任何字节不同，说明有人改了源码却没
        # 提交新产物。不要用 `git status --porcelain | grep` 之类的近似判断——
        # 空输出才是唯一干净的证据。
        run: git diff --exit-code -- ui/dist
