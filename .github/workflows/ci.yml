name: CI

# 本仓库唯一的门禁。跑的是 CONTRIBUTING.md §5「提交前检查」列的那两条命令，
# 逐字相同——本地绿而 CI 红，只可能是环境差异，不是命令差异。
# 在此之上多一条锁文件漂移门禁（`uv lock --check`）：§5 没写，但锁文件
# 一旦漂移，本地跑同样的两条命令照样是绿的，这条只能放在 CI。
#
# 为什么只有 3.12：pyproject.toml 的 requires-python 是 ">=3.12,<3.13"，
# 3.13 不在支持范围内，矩阵里加它等于给自己造一个必然红的目标。
on:
  push:
    branches: [main]
  pull_request:

# PR：按分支分组，连推时取消上一轮——省 runner，也不会有过期的绿色。
# main：按 commit 分组，每个 commit 都要拿到自己的结论。
#   一开始两种都用 ref 分组 + cancel-in-progress: true，结果连续合并时
#   后一个把前一个取消掉了：PR #20 的合并提交 d69e7f8（就是引入本 CI 的
#   那个提交）的 CI 被 #22 的合并取消，从未拿到结论。CONTRIBUTING §2 说
#   "main 永远可运行"，那就得每个 commit 都真跑过，不能靠前一个绿色顶替。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}) · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 每个平台的上限。默认是 360 分钟：一个挂住的测试会把 runner 占 6 小时，
    # 而"超时"和"挂住"对排查是两件完全不同的事——超时至少会带着已经跑过的
    # 输出结束。（实测踩过：windows job 卡在 Pytest 里 20 分钟没动静。）
    timeout-minutes: 25
    strategy:
      # 一个平台红了不要取消其他平台：否则看不到全貌，
      # 报告只能写"矩阵失败"，没法说清是谁、为什么。
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Windows 是**主打平台**。issue #21 记的那 12 项已经逐条定位并修掉
          # （CRLF 哈希、控制台编码、权限位语义、Windows 的 pid/心跳探测），
          # 这个平台必须一直在矩阵里——它掉出过一次，代价是 5 个里程碑都没在
          # 主平台上验证过。
          #
          # 已知：M5 的 IPC 在这个平台上会**偶发**握手失败（issue #50，
          # digest sent was rejected / digest received was wrong，每轮失败的
          # 用例与条数都不同）。根因未定位，需要真 Windows 机器；生产侧的
          # accept 循环本就按"可重试"实现，测试侧也已按契约重试。
          # 不设为 required（main 的必需检查只有 ubuntu + macOS），所以它红着
          # 不挡合并——但**不**给它 continue-on-error：那会让失败彻底消失，
          # issue #50 修好之前，这个 job 每次红都是在提醒还欠着一件事。
          - windows-latest
        python:
          - "3.12"
    defaults:
      run:
        # 显式写 bash：这两个平台的默认 shell 本来就是 bash，写出来是为了
        # 将来把 Windows 加回矩阵时语义不变（Windows 默认是 PowerShell，
        # 那边的引号规则会让 addopts="" 这类参数长得不一样）。
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          # 缓存 uv 的缓存目录：下载过的 Python 解释器、wheel 都复用
          enable-cache: true
          # 只有锁文件变了才换缓存键——依赖没动就命中同一份
          cache-dependency-glob: uv.lock

      - name: 安装 Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: 锁文件漂移门禁
        # 这条是整个 workflow 里最重要的一条，也是最容易写错的一条。
        # 实测（uv 0.11.7）：`uv sync --frozen` 在 pyproject 改过、锁文件过期时
        # 仍然 exit 0——"使用锁文件"不等于"校验锁文件"。只有 `uv lock --check`
        # 会让漂移变红。没有这条，锁文件可以悄悄烂掉而 CI 一直绿。
        run: uv lock --check

      - name: 同步依赖（只读锁文件）
        run: uv sync --frozen

      - name: Ruff
        # --frozen 让 uv run 不去动锁文件；否则 pyproject 一有风吹草动，
        # uv run 会顺手把锁文件改掉，上面那条漂移门禁就白设了。
        run: uv run --frozen ruff check .

      - name: Windows IPC 二进制密钥回归
        if: runner.os == 'Windows'
        run: uv run --frozen pytest tests/test_ipc.py::test_authkey_preserves_binary_bytes_on_disk -o addopts="" -vv --tb=short

      - name: Pytest
        # 清空项目的 -q，避免重复传入后隐藏汇总；-rs 保留平台跳过原因。
        # Windows 输出逐条用例和长等待时的线程栈，作业超时也能定位卡点（#50）。
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            uv run --frozen pytest -o addopts="" -vv -rs --tb=short --durations=20 -o faulthandler_timeout=60
          else
            uv run --frozen pytest -o addopts="" -q -rs
          fi

  # UI 是 M5 才进仓库的：React + TS，构建产物（ui/dist）提交进仓库，因为
  # Host 运行时直接加载它——用户机器上不需要 Node。既然产物是"源码的一部分"，
  # 就必须有一条门禁保证它**没有和源码漂移**，否则会出现"改了前端没重新构建，
  # 界面还是旧版"这种只有用户能发现的问题。
  #
  # 只在 ubuntu 跑：前端不涉及平台差异（没有原生模块），三平台各跑一遍纯属浪费
  # runner；跨平台语义由 Python 的 test_host.py（三平台矩阵）覆盖。
  ui:
    name: ui · typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本地构建产物所用的版本对齐：vite 的产物哈希由源码决定，但
          # lockfile 解释器/打包器版本变化会改变产物，dist 漂移门禁就会误报。
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 安装前端依赖（只读锁文件）
        run: pnpm --dir ui install --frozen-lockfile

      - name: 类型检查
        run: pnpm --dir ui run typecheck

      - name: 前端单测
        run: pnpm --dir ui run test

      - name: 构建
        run: pnpm --dir ui run build

      - name: 提交的 dist 必须与源码构建一致
        # `git diff --exit-code`：重建后若有任何字节不同，说明有人改了源码却没
        # 提交新产物。不要用 `git status --porcelain | grep` 之类的近似判断——
        # 空输出才是唯一干净的证据。
        run: git diff --exit-code -- ui/dist
