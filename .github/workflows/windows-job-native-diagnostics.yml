name: Windows Job native diagnostics
on:
  push:
    branches: [codex/windows-job-native-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run Windows Job and fallback tests
        run: |
          for ($i = 0; $i -lt 8; $i++) {
            uv run --frozen pytest -o addopts= -q -s --tb=short tests/test_exec_job_object.py::TestWindowsNative::test_dispatch_job_run_control_clears_native_tree[cancel]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
