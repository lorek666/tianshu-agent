[package]
name = "tianshu-desktop"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "tianshu_desktop"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
